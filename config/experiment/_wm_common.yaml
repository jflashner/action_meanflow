# @package _global_
# World-model-only training on a fixed (static) dataset, shared by all world model experiments so that every
# method sees the same data, U-Net, optimizer and number of updates. Usage:
#   python src/main.py +experiment=wm_meanflow env.train.id=BoxingNoFrameskip-v4 static_dataset.path=<data>/Boxing

common:
  devices: all  # under Slurm, keep the GPUs assigned to the job

static_dataset:
  path: ???  # folder with train/ and test/ subfolders, created by src/collect_dataset.py
  ignore_sample_weights: True

training:
  world_model_only: True
  num_final_epochs: 100  # x denoiser.training.steps_per_epoch = number of updates
  compile_wm: False

evaluation:
  every: 10
  generation:
    num_samples: 512
    nfe: [1]

checkpointing:
  save_agent_every: 25
  num_to_keep: 4

denoiser:
  training:
    steps_first_epoch: 1000
    steps_per_epoch: 1000
    ema_decay: 0.999
