# @package _global_
# MeanFlow trained on self-generated context: for half of the samples, the 4 frames before the target are
# generated by the model with 1-step rollouts from ground-truth context (cheap with a 1-step model).
defaults:
  - wm_meanflow

denoiser:
  training:
    self_forcing:
      prob: 0.5
      rollout_steps: 4
      num_steps: 1
      start_after_steps: 20000
