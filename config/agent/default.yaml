defaults:
  - denoiser: edm  # edm (DIAMOND) | fm | meanflow | shortcut, all with the same U-Net (agent/denoiser/_unet.yaml)
  - _self_

_target_: agent.AgentConfig

rew_end_model:
  _target_: models.rew_end_model.RewEndModelConfig
  lstm_dim: 512
  img_channels: ${agent.denoiser.inner_model.img_channels}
  img_size: ${env.train.size}
  cond_channels: 128
  depths: [2,2,2,2]
  channels: [32,32,32,32]
  attn_depths: [0,0,0,0]

actor_critic:
  _target_: models.actor_critic.ActorCriticConfig
  lstm_dim: 512
  img_channels: ${agent.denoiser.inner_model.img_channels}
  img_size: ${env.train.size}
  channels: [32,32,64,64]
  down: [1,1,1,1]
